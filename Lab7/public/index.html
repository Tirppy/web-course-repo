<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="API-backed plant care client for Lab 7." />
    <title>Verdant Logbook API</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <h1>Verdant Logbook API</h1>
          <p>Lab 7 client for the JWT-protected plant API.</p>
        </div>
        <a class="button button-secondary" href="/docs">Swagger docs</a>
      </header>

      <section class="layout">
        <aside class="sidebar">
          <section class="panel">
            <h2>Access token</h2>
            <p id="tokenStatus" class="muted">No token loaded yet.</p>
            <div class="button-row stacked">
              <button type="button" data-role="VISITOR">Visitor</button>
              <button type="button" data-role="WRITER">Writer</button>
              <button type="button" data-role="ADMIN">Admin</button>
            </div>
          </section>

          <section class="panel">
            <h2>Find plants</h2>
            <label>
              Search
              <input id="searchInput" type="search" placeholder="Name, species, room, notes" />
            </label>
            <label>
              Page size
              <select id="limitInput">
                <option>3</option>
                <option selected>6</option>
                <option>12</option>
              </select>
            </label>
            <div class="button-row">
              <button type="button" id="previousPage">Previous</button>
              <button type="button" id="nextPage">Next</button>
            </div>
          </section>

          <p id="message" class="message" hidden></p>
        </aside>

        <section class="content">
          <section class="panel">
            <div class="section-header">
              <h2>Create plant</h2>
              <p class="muted">Uses `POST /api/plants` with the active JWT.</p>
            </div>

            <form id="plantForm" class="plant-form">
              <label>
                Plant name
                <input name="name" required placeholder="Nova" />
              </label>
              <label>
                Species
                <input name="species" required placeholder="Monstera deliciosa" />
              </label>
              <label>
                Room
                <input name="room" required placeholder="Living room" />
              </label>
              <label>
                Water every
                <input name="wateringInterval" type="number" min="1" max="60" value="7" required />
              </label>
              <label>
                Light
                <select name="light">
                  <option>Bright indirect</option>
                  <option>Filtered sun</option>
                  <option>Partial shade</option>
                  <option>Low light</option>
                </select>
              </label>
              <label>
                Health
                <select name="health">
                  <option value="thriving">Thriving</option>
                  <option value="steady">Steady</option>
                  <option value="watch">Needs attention</option>
                </select>
              </label>
              <label class="span-2">
                Notes
                <textarea name="notes" placeholder="Care notes"></textarea>
              </label>
              <button class="button-primary span-2" type="submit">Create plant</button>
            </form>
          </section>

          <section class="panel">
            <div class="section-header">
              <h2>API collection</h2>
              <p class="muted">Read, water, favorite, or delete through protected endpoints.</p>
            </div>
            <section id="plantGrid" class="plant-grid" aria-live="polite"></section>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
